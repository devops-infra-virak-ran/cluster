# external-dns — publishes each Ingress host as a Route 53 alias to its ALB.
#
#   chart  external-dns 1.23.0   (kubernetes-sigs)
#   app    0.23.0
#
# `make controllers` passes the zone id and the cluster name as the owner id.
# No domain filter: one naming dev.<zone> is narrower than the zone, and
# external-dns then ignores the zone and writes nothing (seen 2026-10-26).
#
# All three environments write into the same hosted zone. txtOwnerId is what
# keeps them apart: every record external-dns creates gets a TXT record naming
# its owner, and with policy=sync it deletes only records it owns. Without it,
# prod's external-dns would see dev's records as stale and delete them.

serviceAccount:
  create: true
  name: external-dns

provider:
  name: aws

sources:
  - ingress

# sync: create, update AND delete — a removed Ingress takes its record with
# it. upsert-only would leave dangling names pointing at deleted ALBs.
policy: sync

registry: txt

# Needed because prod's site is the zone apex. With no prefix, the TXT record
# for devops-selft-learning.xyz is named a-devops-selft-learning.xyz: a
# different domain, outside the zone, so it is dropped with no error. The A
# record then has no owner, and external-dns never updates or deletes it, so a
# new ALB leaves DNS pointing at a deleted one. %{record_type} and the trailing
# dot keep it in the zone: extdns-a.devops-selft-learning.xyz.
#
# Do not change this once records exist: the old TXT names stop being read, and
# those records lose their owner the same way.
txtPrefix: "extdns-%{record_type}."

# Re-check every minute, and also as soon as an Ingress changes.
interval: 1m
triggerLoopOnEvent: true

# extraArgs is not set here: `make controllers` passes the whole list with
# --set-json (the hosted zone's id), and a list given on the command line
# replaces this one rather than merging with it. Records for an ALB are alias
# A records by default — the apex cannot hold a CNAME, and alias queries are
# free.

resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { memory: 128Mi }
