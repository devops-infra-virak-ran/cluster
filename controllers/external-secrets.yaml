# External Secrets Operator — copies AWS Secrets Manager values into
# Kubernetes Secrets.
#
#   chart  external-secrets 2.12.0
#   app    v2.12.0
#
# The controller's own role (pod identity) can only assume the per-team roles;
# each team's SecretStore names its role (helm/teams/templates/secrets.yaml).

serviceAccount:
  create: true
  name: external-secrets

installCRDs: true

# The cluster-wide kinds are not used: every store is a namespaced
# SecretStore, so no team can reference a store another team owns.
processClusterStore: false
processClusterExternalSecret: false
processPushSecret: false
processClusterPushSecret: false

resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { memory: 256Mi }

webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

certController:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
