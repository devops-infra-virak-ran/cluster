# ArgoCD web UI — served at https://<site>/argocd, through the same ALB and
# ingress controller the services already use.
#
# This is the template. Do not apply it directly: the hostname and the allowed
# CIDRs are per-environment facts, and this repository is public. Render a
# filled-in copy:
#
#   make argocd-expose WORKSPACE=dev   # writes argocd/ingress-dev.yaml (gitignored) and applies it
#
# Placeholders replaced by the render:
#   __WORKSPACE__       the environment name
#   __HOSTNAME__        the host the ALB certificate covers
#   __ALLOWED_CIDRS__   comma-separated CIDRs allowed to reach the UI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
    workspace: __WORKSPACE__
  annotations:
    # Plain HTTP to the backend. argocd-expose sets server.insecure, so
    # argocd-server serves the UI over HTTP and TLS terminates at the ALB.
    # Without that pair this must be HTTPS, or nginx gets a TLS handshake
    # error from a server that is speaking HTTPS on port 80.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

    # No rewrite-target on purpose. ArgoCD is told to serve itself under
    # /argocd (server.rootpath), so it expects to receive the prefix. Stripping
    # it here would load the page and then 404 every asset underneath it.

    # Who may reach the admin UI. This compares against the REAL client
    # address, which only works because the controller is configured to trust
    # the ALB's X-Forwarded-For (use-forwarded-headers, set by `make ingress`).
    # Without that, nginx compares against the ALB's private IP, matches
    # nothing, and returns 403 to everyone — including you.
    nginx.ingress.kubernetes.io/whitelist-source-range: "__ALLOWED_CIDRS__"
spec:
  ingressClassName: nginx
  rules:
    - host: __HOSTNAME__
      http:
        paths:
          - path: /argocd
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
