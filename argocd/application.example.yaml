# ArgoCD Application — deploys the `services` chart for ONE environment.
#
# This is the template. Do not apply it directly: the real values (ECR prefix,
# ALB URL) are per-environment infra facts, and this repository is public, so
# they are not committed. Render a filled-in copy from platform.<ws>.env:
#
#   make argocd-app WORKSPACE=dev      # writes argocd/application-dev.yaml (gitignored) and applies it
#
# Placeholders replaced by the render:
#   __WORKSPACE__          the environment name
#   __REPO_URL__           the git repo ArgoCD pulls from
#   __TARGET_REVISION__    branch/tag
#   __ECR_IMAGE_PREFIX__   global.imageRegistry  (carries the account id)
#   __ALB_URL__            global.ingress.url
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: services-__WORKSPACE__
  namespace: argocd
  # Keep the app if the Application object is deleted by accident; only an
  # explicit prune during sync removes workloads.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: __REPO_URL__
    targetRevision: __TARGET_REVISION__
    path: helm/services
    helm:
      releaseName: apps
      # Paths are relative to the chart (path: helm/services). ../ steps up to
      # helm/, matching what `make helm-deploy` passes with -f.
      valueFiles:
        - ../values/api-service/services.yaml
        - ../values/web-service/services.yaml
        - ../env/__WORKSPACE__.yaml
      # The two facts helm-deploy injected from platform.sh. ArgoCD cannot run
      # platform.sh, so they are set here instead.
      parameters:
        - name: global.imageRegistry
          value: __ECR_IMAGE_PREFIX__
        - name: global.ingress.url
          value: __ALB_URL__

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  # Manual sync: ArgoCD shows drift but does not act until you sync, so it does
  # not fight `make helm-deploy` while both exist. Turn on automation later by
  # adding an `automated:` block here.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
