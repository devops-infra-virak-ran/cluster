groups:
  api-service:
    services:
      auth-api:
        enabled: true
        image: { tag: "prod.v3.0.5" }
        replicas: 1
        route: /api/auth
        rewrite: null
        envFrom:
          - secretRef: { name: app-env }

      core-api:
        enabled: true
        image: { tag: "prod.v2.0.2" }
        replicas: 1
        route: null
        routePrefix: null
        probes:
          path: /api/health
          readyPath: /api/health
        envFrom:
          - secretRef: { name: app-env }

  web-service:
    services:
      client-side:
        image: { tag: "prod.v1.0.7" }
        replicas: 1
        envFrom:
          - secretRef: { name: app-env }
