# ─── dev ─────────────────────────────────────────────────────────────────────
# Where every build lands first. One replica minimum, scaling to three.
#
# Merged LAST, on top of helm/values/<group>/services.yaml, so anything named
# here wins. CI moves the tags (make svc-tag); promotion to uat is the same tag
# copied into uat.yaml — the identical image, never a rebuild.
#
# `teams:` at the bottom sizes each team's namespace (helm/teams).

groups:
  api-service:
    services:
      auth-api:
        image: { tag: "prod.v3.0.5" }
        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 70

      core-api:
        image: { tag: "prod.v2.0.2" }
        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 70

  web-service:
    services:
      client-side:
        image: { tag: "1.0.7-13-ga880ae3" }
        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 70

# ─── Team namespaces ─────────────────────────────────────────────────────────
# What each team may use in this environment. See helm/teams/values.yaml.

teams:
  api-service:
    quota: { cpu: "2", memory: 4Gi, pods: "20" }
  web-service:
    quota: { cpu: "1", memory: 2Gi, pods: "10" }
