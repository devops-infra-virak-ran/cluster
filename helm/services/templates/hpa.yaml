{{/*
One HorizontalPodAutoscaler per service that asks for one.

Same shape as deployment.yaml: `range` over the merged service map, and a
service with `autoscaling.enabled: false` (the default) renders nothing at all.

autoscaling/v2 — stable since Kubernetes 1.23 and the only version that
supports the `behavior` block below. v2beta2 is gone in 1.26+.

HPA scales on utilisation as a PERCENTAGE OF THE RESOURCE REQUEST, not of the
node. `defaults.resources.requests.cpu` is 100m, so targetCPU 70 means "scale
when the average pod is using 70m". A service that clears its requests must not
enable autoscaling: with no request there is no denominator, and the HPA sits
at <unknown>/70% forever without ever scaling.
*/}}
{{- $all := include "services.all" $ | fromYaml }}
{{- range $name, $svc := $all }}
{{- if and $svc.enabled $svc.autoscaling $svc.autoscaling.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
{{- if not (and $svc.resources $svc.resources.requests $svc.resources.requests.cpu) }}
{{- fail (printf "service %q enables autoscaling but sets no resources.requests.cpu — the HPA has nothing to compute utilisation against" $name) }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "services.name" $ctx }}
  labels:
    {{- include "services.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "services.name" $ctx }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    {{- with $svc.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with $svc.autoscaling.targetMemoryUtilizationPercentage }}
    {{/*
      Memory is opt-in and usually the wrong signal: most runtimes (the JVM,
      Node) grow the heap and do not give it back, so memory rises and never
      falls. The HPA then scales up and never scales down.
    */}}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
  {{- with $svc.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
