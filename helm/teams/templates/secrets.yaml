{{/*
The app-env Secret every service reads with envFrom, filled from AWS Secrets
Manager by External Secrets.

  Secrets Manager  <secretsNamePrefix>/<team>     {"DB_PASSWORD": "…", …}
        │  read by assuming <secretsRolePrefix><team>
        ▼
  SecretStore aws-secrets-manager  (this namespace)
        │
        ▼
  ExternalSecret app-env  →  Secret app-env  →  envFrom in every Deployment

Each team's SecretStore names that team's role, and each role can read that
team's secret only. A team that writes an ExternalSecret for another team's
key gets AccessDenied — the isolation is in IAM, not in this file.

dataFrom.extract turns every JSON key into a Secret key, so adding a variable
is a `make secret-push`, not a change here. refreshInterval is how long a
changed value takes to arrive; the pods still need a restart to read it.
*/}}
{{- $g := .Values.global }}
{{- if and $g.region $g.secretsNamePrefix $g.secretsRolePrefix }}
{{- $all := include "teams.all" $ | fromYaml }}
{{- range $name, $t := $all }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: {{ $name }}
  labels:
    {{- include "teams.labels" $ctx | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $g.region }}
      # No auth block: the controller's own pod identity, which may only
      # assume the per-team roles.
      role: {{ printf "%s%s" $g.secretsRolePrefix $name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-env
  namespace: {{ $name }}
  labels:
    {{- include "teams.labels" $ctx | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: app-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ printf "%s/%s" $g.secretsNamePrefix $name }}
{{- end }}
{{- end }}
