# Default StorageClass for the EBS CSI driver.
#
#   make storage WORKSPACE=dev
#
# The driver alone provisions nothing: a PVC names a StorageClass, and without
# a default one every PVC stays Pending with "no persistent volumes available".

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com

# WaitForFirstConsumer, not Immediate: an EBS volume lives in exactly one
# availability zone. Provisioning before the pod is scheduled can put the
# volume in an AZ with no room for the pod, and the pod is then unschedulable
# anywhere — the volume it needs cannot follow it.
volumeBindingMode: WaitForFirstConsumer

# These are reproducible workloads; Retain would strand volumes, and a stranded
# EBS volume bills whether or not anything reads it.
reclaimPolicy: Delete
allowVolumeExpansion: true

parameters:
  type: gp3
  encrypted: "true"
  # gp3 includes 3000 IOPS and 125 MB/s at no extra cost — below those numbers
  # you are paying the same for less.
  iops: "3000"
  throughput: "125"
  csi.storage.k8s.io/fstype: ext4
