# Kubespray — cluster-wide settings, loaded for every host in k8s_cluster.
#
# The directory name is the group name, exactly. A file at group_vars/
# k8s-cluster.yml (hyphen) would map to a group called "k8s-cluster", which
# does not exist, so Ansible would load nothing — no error, no warning, no
# settings applied. Only the file inside k8s_cluster/ is read.

# ─── Version ─────────────────────────────────────────────────────────────────
# Pinned, and it must be a version the image tag supports. v2.31.0 carries
# checksums for 1.33.0 through 1.35.4 and nothing else:
#
#   docker run --rm quay.io/kubespray/kubespray:v2.31.0 python3 -c \
#     "import yaml; print(list(yaml.safe_load(open( \
#      'roles/kubespray_defaults/vars/main/checksums.yml'))['kubelet_checksums']['amd64']))"
#
# KUBESPRAY_VERSION in the Makefile and this line move together. Nothing warns
# you when they disagree — the run fails partway, on a machine that is now half
# configured.
kube_version: v1.35.4

# ─── Networking ──────────────────────────────────────────────────────────────
# Both are Kubespray defaults, restated because the constraint that makes them
# correct lives in another directory: they must not overlap the VPC CIDR
# (10.0.0.0/16, terraform/env/<workspace>.tfvars). Widen the VPC and pod
# traffic starts colliding with real subnets — move these first.
kube_service_addresses: 10.233.0.0/18
kube_pods_subnet: 10.233.64.0/18

# ─── API server ──────────────────────────────────────────────────────────────
# Encrypt Secrets at rest in etcd. Without this a copy of the etcd volume, or
# an etcd snapshot in S3, is a copy of every Secret in plaintext.
kube_encrypt_secret_data: true

# Extra names and addresses to put in the apiserver's serving certificate.
# Empty is correct here: kubeadm already includes localhost and 127.0.0.1
# (roles/kubernetes/control-plane/tasks/kubeadm-setup.yml), which is what the
# tunnelled kubeconfig connects to. Add a DNS name here if the API ever gets a
# real load balancer in front of it.
supplementary_addresses_in_ssl_keys: []

# ─── Hardening ───────────────────────────────────────────────────────────────
# Audit logging to /var/log/kubernetes/audit/ on each control-plane node.
# Bounded, because an unbounded audit log is a way to fill the root disk and
# take the apiserver down with it.
kubernetes_audit: true
audit_log_maxage: 30
audit_log_maxbackups: 10
audit_log_maxsize: 100

# ─── Kubelet ─────────────────────────────────────────────────────────────────
# Reserve headroom so a busy pod cannot starve kubelet and containerd and take
# the whole node NotReady. On a t3.medium (2 vCPU / 4 GB) this hands ~200m and
# ~512Mi to the system, which is a real fraction of the node — it is also the
# difference between one bad pod and a lost node.
kubelet_config_extra_args:
  systemReserved:
    cpu: 100m
    memory: 256Mi
  kubeReserved:
    cpu: 100m
    memory: 256Mi
  evictionHard:
    memory.available: 200Mi
    nodefs.available: 10%
