# Kubespray — what AWS integration this cluster does and does not have.
#
# The short version: no cloud controller manager, no in-cluster load balancer
# provisioning, and the EBS CSI driver installed from upstream rather than by
# Kubespray. Each of those is a decision forced by v2.31.0, not a preference.

# ─── No cloud controller manager ─────────────────────────────────────────────
# `cloud_provider` is left unset on purpose.
#
# Kubernetes removed the in-tree AWS provider in 1.31, so the only way to run
# one is `cloud_provider: external` plus an external CCM. Kubespray v2.31.0
# validates that setting against a fixed list:
#
#   roles/validate_inventory/tasks/main.yml
#   external_cloud_provider in ['hcloud','huaweicloud','oci','openstack','vsphere','manual']
#
# `aws` is not on it. Kubespray dropped the AWS CCM role; the AWS entry in
# docs/ is about the in-tree provider that no longer exists.
#
# `manual` would pass validation, but it only sets --cloud-provider=external on
# the kubelet and apiserver and leaves the CCM to you. Until one is installed,
# every node stays tainted node.cloudprovider.kubernetes.io/uninitialized:
# NoSchedule and nothing runs. An unset cloud_provider gives a working cluster
# with no cloud integration, which is the honest description of this one.
#
# What that costs: Service type=LoadBalancer stays Pending forever, because
# nothing in the cluster can create an ELB. Ingress here is the ALB that
# Terraform's security module already points at the NodePort range.
#
# What it does not cost: EBS volumes. The CSI driver reads instance identity
# and its availability zone from IMDS and needs no CCM.

# ─── EBS CSI driver ──────────────────────────────────────────────────────────
# Off, and installed separately by `make storage`.
#
# Kubespray's own role would deploy docker.io/amazon/aws-ebs-csi-driver:latest
# (roles/kubernetes-apps/csi_driver/aws_ebs/defaults/main.yml). That Docker Hub
# repository was abandoned around v1.6.2 in 2021 — the driver moved to
# registry.k8s.io — so `latest` there is five years stale, and an unpinned tag
# would make the cluster unreproducible even if it were current.
#
# Its StorageClass is also not the one we want: `ebs-sc`, gp2, xfs, and only
# created when persistent_volumes_enabled is true.
#
# make storage applies the upstream release and storage/gp3-storageclass.yaml.
aws_ebs_csi_enabled: false
