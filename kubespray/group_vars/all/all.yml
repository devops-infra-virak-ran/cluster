# Kubespray — variables for every host.
#
# Ansible auto-loads this because run.sh mounts group_vars/ next to the
# inventory file. Do NOT pass these with `-e @...`: extra-vars are the highest
# precedence tier in Ansible and would override Kubespray's own host_vars and
# role logic, which is where a lot of its correctness lives.
#
# Everything set here is a deliberate departure from a v2.31.0 default. Where
# the default is already right, the line is absent rather than restated.

# ─── Container runtime ───────────────────────────────────────────────────────
container_manager: containerd

# ─── Bootstrap ───────────────────────────────────────────────────────────────
# The AMI is Ubuntu 24.04, which cloud-init has already given python3.
ansible_python_interpreter: /usr/bin/python3

# Nodes reach the internet through the NAT gateway. Set these only if egress
# has to go via a proxy.
http_proxy: ""
https_proxy: ""
no_proxy: ""

# ─── Access ──────────────────────────────────────────────────────────────────
# Writes an admin kubeconfig to inventory/<workspace>/artifacts/admin.conf at
# the end of a run. Its server address is the control plane's private IP, so
# scripts/kubeconfig.sh rewrites it and tunnels through the bastion.
kubeconfig_localhost: true

# Also drops a matching kubectl binary next to it. Worth having: kubectl
# supports one minor version of skew either side of the apiserver, and the
# kubectl already on a laptop is usually further behind than that.
kubectl_localhost: true

artifacts_dir: "{{ inventory_dir }}/artifacts"

# ─── Downloads ───────────────────────────────────────────────────────────────
# Every node downloads its own binaries and images, straight out through the
# NAT gateway.
#
# download_run_once: true is the tempting setting — fetch once, distribute to
# the rest — but it only pays off when the Ansible controller is inside the
# VPC. It is not: it is a container on a laptop, reaching the nodes through the
# bastion. So "distribute" means every file takes this route
#
#   internet → cp1 → bastion → laptop → bastion → each of the 6 nodes
#
# crossing the bastion twice and a home uplink once. Measured, per file:
#
#   Download item                          10.7s
#   Copy file back to ansible host cache   30.0s
#   Copy file from cache to nodes          3m40s
#
# times dozens of files — and it wedged the SSH sessions through the bastion
# badly enough that sudo stopped answering, which surfaces as
# "Timeout (302s) waiting for privilege escalation prompt".
#
# Downloading on each node instead is parallel, keeps the bastion out of the
# data path entirely, and costs about 12 GB of NAT transfer — some $0.55 at
# $0.045/GB. Set this back to true if you ever run Ansible from the bastion.
download_run_once: false
download_localhost: false
download_keep_remote_cache: true
